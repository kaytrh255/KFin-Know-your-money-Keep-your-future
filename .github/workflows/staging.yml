name: Staging

# Two modes:
#
#   pull_request  — rehearse the exact staging Compose stack (image built from
#                   this commit, real Caddy TLS, a disposable PostgreSQL, roles,
#                   migrations) and run the staging smoke test against it over
#                   HTTPS. This is what proves the deployment path before a host
#                   exists, and it needs no secret.
#
#   workflow_dispatch — publish the image to GHCR and deploy it to the staging
#                   host, then run the same smoke test against the public URL.
#                   GitHub only dispatches a workflow that exists on the default
#                   branch, so this becomes available after this file merges.
#
# This repository creates no account, DNS record or certificate. The owner steps
# are in deploy/staging/README.md.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      provision_roles:
        description: Run the one-time database role provisioning before deploying
        type: boolean
        default: false
      deploy:
        description: Deploy after publishing the image
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearsal:
    name: Rehearse the staging stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KFIN_IMAGE: kfin-runtime:rehearsal
      GIT_COMMIT: ${{ github.sha }}
      # CI-only values for a disposable database; not secrets and not reused.
      STAGING_DB_MODE: container
      STAGING_DB_NAME: kfin_staging
      STAGING_DB_ADMIN_PASSWORD: rehearsal_admin_password_not_a_secret
      KFIN_APP_PASSWORD: rehearsal_app_password_not_a_secret
      KFIN_MIGRATOR_PASSWORD: rehearsal_migrator_password_not_a_secret
      KFIN_OPERATOR_PASSWORD: rehearsal_operator_password_not_a_secret
      STAGING_SITE_ADDRESS: localhost
      STAGING_TLS_ARGS: internal
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Generate rehearsal secrets
        run: |
          {
            echo "REHEARSAL_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "REHEARSAL_PREVIEW_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - name: Start the staging database
        run: |
          # The stack expects the real file to exist; CI has no secrets to put in it.
          : > deploy/staging/staging.env
          docker compose \
            -f deploy/staging/docker-compose.yml \
            -f deploy/staging/docker-compose.database.yml \
            up -d --wait db
      - name: Provision least-privilege roles
        env:
          ROLE_ADMIN_DATABASE_URL: postgresql://postgres:rehearsal_admin_password_not_a_secret@127.0.0.1:55433/kfin_staging
        run: corepack pnpm run db:provision-roles
      - name: Build the runtime image from this commit
        run: |
          docker compose \
            -f deploy/staging/docker-compose.yml \
            -f deploy/staging/docker-compose.database.yml \
            -f deploy/staging/docker-compose.rehearsal.yml \
            build kfin
      - name: Apply migrations with the same image
        run: |
          umask 077
          printf 'MIGRATION_DATABASE_URL=postgresql://kfin_migrator:%s@db:5432/kfin_staging\n' \
            "$KFIN_MIGRATOR_PASSWORD" > deploy/staging/migration.env
          docker run --rm \
            --env-file deploy/staging/migration.env \
            --network kfin-staging-edge \
            "$KFIN_IMAGE" node migrate.bundle.mjs
      - name: Start the stack behind Caddy
        run: |
          docker compose \
            -f deploy/staging/docker-compose.yml \
            -f deploy/staging/docker-compose.database.yml \
            -f deploy/staging/docker-compose.rehearsal.yml \
            up -d
      - name: Export the Caddy internal CA
        run: |
          for attempt in $(seq 1 30); do
            if docker compose \
              -f deploy/staging/docker-compose.yml \
              -f deploy/staging/docker-compose.database.yml \
              -f deploy/staging/docker-compose.rehearsal.yml \
              cp caddy:/data/caddy/pki/authorities/local/root.crt ./caddy-root.crt 2>/dev/null; then
              test -s ./caddy-root.crt && exit 0
            fi
            sleep 2
          done
          echo "::error::could not export the Caddy internal CA"
          exit 1
      - name: Wait for HTTPS
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --cacert ./caddy-root.crt https://localhost/health/ready >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::the staging stack did not answer over HTTPS"
          docker compose \
            -f deploy/staging/docker-compose.yml \
            -f deploy/staging/docker-compose.database.yml \
            -f deploy/staging/docker-compose.rehearsal.yml \
            logs --tail=120
          exit 1
      - name: Run the staging smoke test over HTTPS
        env:
          STAGING_URL: https://localhost
          STAGING_CA_FILE: ./caddy-root.crt
        run: node scripts/smoke/staging-smoke.mjs
      - name: Publish stack logs on failure
        if: failure()
        run: |
          docker compose \
            -f deploy/staging/docker-compose.yml \
            -f deploy/staging/docker-compose.database.yml \
            -f deploy/staging/docker-compose.rehearsal.yml \
            logs --tail=200
      - name: Tear down
        if: always()
        run: |
          docker compose \
            -f deploy/staging/docker-compose.yml \
            -f deploy/staging/docker-compose.database.yml \
            -f deploy/staging/docker-compose.rehearsal.yml \
            down -v --remove-orphans

  publish:
    name: Publish the runtime image
    if: github.event_name == 'workflow_dispatch'
    needs: rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        id: image
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY}/kfin-runtime"
          reference="${repository}:sha-${GITHUB_SHA::7}"
          docker build --build-arg GIT_COMMIT="$GITHUB_SHA" --tag "$reference" .
          docker push "$reference"
          docker tag "$reference" "${repository}:staging"
          docker push "${repository}:staging"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "published ${reference} and ${repository}:staging"

  deploy:
    name: Deploy to staging
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
    env:
      KFIN_IMAGE: ${{ needs.publish.outputs.image }}
      STAGING_DB_MODE: ${{ vars.STAGING_DB_MODE || 'container' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Verify the owner-provided configuration
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          STAGING_SITE_ADDRESS: ${{ secrets.STAGING_SITE_ADDRESS }}
          STAGING_TLS_ARGS: ${{ secrets.STAGING_TLS_ARGS }}
          STAGING_AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
          STAGING_FINANCIAL_PREVIEW_SIGNING_KEY: ${{ secrets.STAGING_FINANCIAL_PREVIEW_SIGNING_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          STAGING_DB_ADMIN_PASSWORD: ${{ secrets.STAGING_DB_ADMIN_PASSWORD }}
          KFIN_APP_PASSWORD: ${{ secrets.KFIN_APP_PASSWORD }}
          KFIN_MIGRATOR_PASSWORD: ${{ secrets.KFIN_MIGRATOR_PASSWORD }}
        run: |
          missing=()
          for name in STAGING_HOST STAGING_USER STAGING_SSH_KEY STAGING_KNOWN_HOSTS \
                      STAGING_SITE_ADDRESS STAGING_TLS_ARGS STAGING_AUTH_SECRET \
                      STAGING_FINANCIAL_PREVIEW_SIGNING_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "$STAGING_DB_MODE" = "container" ]; then
            for name in STAGING_DB_ADMIN_PASSWORD KFIN_APP_PASSWORD KFIN_MIGRATOR_PASSWORD; do
              [ -n "${!name}" ] || missing+=("$name")
            done
          else
            for name in STAGING_DATABASE_URL STAGING_MIGRATION_DATABASE_URL; do
              [ -n "${!name}" ] || missing+=("$name")
            done
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing GitHub Environment 'staging' secret(s): ${missing[*]}"
            echo "Owner steps: deploy/staging/README.md (Configure the environment)."
            exit 1
          fi
          echo "configuration present for database mode '$STAGING_DB_MODE'"
      - name: Install the deploy key
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh -o BatchMode=yes "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" true
      - name: Upload the stack definition
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          target="$STAGING_USER@$STAGING_HOST"
          ssh "$target" 'mkdir -p /opt/kfin-staging'
          scp deploy/staging/docker-compose.yml "$target:/opt/kfin-staging/docker-compose.yml"
          scp deploy/staging/docker-compose.database.yml "$target:/opt/kfin-staging/docker-compose.database.yml"
          scp deploy/staging/Caddyfile "$target:/opt/kfin-staging/Caddyfile"
          scp scripts/ops/staging-deploy.sh "$target:/opt/kfin-staging/staging-deploy.sh"
      - name: Write the environment on the host
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_AUTH_SECRET: ${{ secrets.STAGING_AUTH_SECRET }}
          STAGING_FINANCIAL_PREVIEW_SIGNING_KEY: ${{ secrets.STAGING_FINANCIAL_PREVIEW_SIGNING_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_DATABASE_SSL_MODE: ${{ secrets.STAGING_DATABASE_SSL_MODE }}
          STAGING_MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          STAGING_DB_ADMIN_PASSWORD: ${{ secrets.STAGING_DB_ADMIN_PASSWORD }}
          KFIN_APP_PASSWORD: ${{ secrets.KFIN_APP_PASSWORD }}
          KFIN_MIGRATOR_PASSWORD: ${{ secrets.KFIN_MIGRATOR_PASSWORD }}
          KFIN_OPERATOR_PASSWORD: ${{ secrets.KFIN_OPERATOR_PASSWORD }}
          STAGING_EMAIL_ADAPTER: ${{ secrets.STAGING_EMAIL_ADAPTER }}
          STAGING_RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          STAGING_EMAIL_FROM_ADDRESS: ${{ secrets.STAGING_EMAIL_FROM_ADDRESS }}
          STAGING_IDEMPOTENCY_RETENTION_HOURS: ${{ secrets.STAGING_IDEMPOTENCY_RETENTION_HOURS }}
          STAGING_HSTS_MAX_AGE_SECONDS: ${{ secrets.STAGING_HSTS_MAX_AGE_SECONDS }}
        run: |
          target="$STAGING_USER@$STAGING_HOST"
          work="$(mktemp -d)"
          umask 077

          # staging.env reaches the API container and holds only what it needs.
          {
            echo "DATABASE_POOL_MAX=5"
            echo "IDEMPOTENCY_RETENTION_HOURS=${STAGING_IDEMPOTENCY_RETENTION_HOURS:-24}"
            echo "AUTH_SECRET=${STAGING_AUTH_SECRET}"
            echo "FINANCIAL_PREVIEW_SIGNING_KEY=${STAGING_FINANCIAL_PREVIEW_SIGNING_KEY}"
            echo "AUTH_ALLOWED_ORIGINS="
            echo "AUTH_COOKIE_SECURE=true"
            echo "HSTS_MAX_AGE_SECONDS=${STAGING_HSTS_MAX_AGE_SECONDS:-31536000}"
            echo "EMAIL_DELIVERY_ADAPTER=${STAGING_EMAIL_ADAPTER:-none}"
            if [ "${STAGING_EMAIL_ADAPTER:-none}" = "none" ]; then echo "STAGING_MODE=true"; fi
            if [ -n "${STAGING_RESEND_API_KEY:-}" ]; then echo "RESEND_API_KEY=${STAGING_RESEND_API_KEY}"; fi
            if [ -n "${STAGING_EMAIL_FROM_ADDRESS:-}" ]; then echo "EMAIL_FROM_ADDRESS=${STAGING_EMAIL_FROM_ADDRESS}"; fi
            if [ "$STAGING_DB_MODE" = "managed" ]; then
              echo "DATABASE_URL=${STAGING_DATABASE_URL}"
              echo "DATABASE_SSL_MODE=${STAGING_DATABASE_SSL_MODE:-verify-full}"
            fi
          } > "$work/staging.env"

          # db.env is read by Compose and the database container only. It never
          # enters the API container: the admin and migration credentials stay
          # out of the application's environment.
          {
            echo "STAGING_DB_MODE=${STAGING_DB_MODE}"
            echo "STAGING_DB_NAME=kfin_staging"
            echo "STAGING_DB_PORT=55433"
            echo "KFIN_PROXY_CIDR=172.28.0.0/16"
            if [ "$STAGING_DB_MODE" = "container" ]; then
              echo "STAGING_DB_ADMIN_PASSWORD=${STAGING_DB_ADMIN_PASSWORD}"
              echo "KFIN_APP_PASSWORD=${KFIN_APP_PASSWORD}"
              echo "KFIN_MIGRATOR_PASSWORD=${KFIN_MIGRATOR_PASSWORD}"
              echo "KFIN_OPERATOR_PASSWORD=${KFIN_OPERATOR_PASSWORD:-}"
            fi
          } > "$work/db.env"

          if [ "$STAGING_DB_MODE" = "managed" ]; then
            printf 'MIGRATION_DATABASE_URL=%s\n' "$STAGING_MIGRATION_DATABASE_URL" > "$work/migration.env"
          else
            printf 'MIGRATION_DATABASE_URL=postgresql://kfin_migrator:%s@db:5432/kfin_staging\n' \
              "$KFIN_MIGRATOR_PASSWORD" > "$work/migration.env"
          fi

          # Streamed over stdin: values never appear in a process argument list.
          ssh "$target" 'umask 077; cat > /opt/kfin-staging/staging.env' < "$work/staging.env"
          ssh "$target" 'umask 077; cat > /opt/kfin-staging/db.env' < "$work/db.env"
          ssh "$target" 'umask 077; cat > /opt/kfin-staging/migration.env' < "$work/migration.env"
          rm -rf "$work"
          echo "wrote staging.env, db.env and migration.env on the host (0600, contents not printed)"
      - name: Provision database roles (one-time)
        if: inputs.provision_roles
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_DATABASE_ADMIN_URL: ${{ secrets.STAGING_DATABASE_ADMIN_URL }}
          STAGING_DB_ADMIN_PASSWORD: ${{ secrets.STAGING_DB_ADMIN_PASSWORD }}
          KFIN_APP_PASSWORD: ${{ secrets.KFIN_APP_PASSWORD }}
          KFIN_MIGRATOR_PASSWORD: ${{ secrets.KFIN_MIGRATOR_PASSWORD }}
          KFIN_OPERATOR_PASSWORD: ${{ secrets.KFIN_OPERATOR_PASSWORD }}
        run: |
          corepack pnpm install --frozen-lockfile
          if [ -n "${STAGING_DATABASE_ADMIN_URL:-}" ]; then
            export ROLE_ADMIN_DATABASE_URL="$STAGING_DATABASE_ADMIN_URL"
          else
            # A container database listens on the host loopback only.
            ssh -o ExitOnForwardFailure=yes -f -N \
              -L 55433:127.0.0.1:55433 "$STAGING_USER@$STAGING_HOST"
            export ROLE_ADMIN_DATABASE_URL="postgresql://postgres:${STAGING_DB_ADMIN_PASSWORD}@127.0.0.1:55433/kfin_staging"
          fi
          corepack pnpm run db:provision-roles
          if [ -z "${STAGING_DATABASE_ADMIN_URL:-}" ]; then pkill -f '55433:127.0.0.1:55433' || true; fi
          echo "roles provisioned; the admin credential is used for this step only"
      - name: Log in to the registry on the host
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "$STAGING_USER@$STAGING_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Run migrations and restart the stack
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SITE_ADDRESS: ${{ secrets.STAGING_SITE_ADDRESS }}
          STAGING_TLS_ARGS: ${{ secrets.STAGING_TLS_ARGS }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" \
            "KFIN_IMAGE='$KFIN_IMAGE' STAGING_SITE_ADDRESS='$STAGING_SITE_ADDRESS' STAGING_TLS_ARGS='$STAGING_TLS_ARGS' DEPLOY_DIR=/opt/kfin-staging bash /opt/kfin-staging/staging-deploy.sh"
      - name: Fetch the staging CA when the host uses the internal CA
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          # Caddy only creates the local CA when it issues an internal
          # certificate, so the absence of the file is the public-CA case.
          if ssh "$STAGING_USER@$STAGING_HOST" \
            'docker exec "$(docker ps -q -f name=kfin-staging-caddy-1)" cat /data/caddy/pki/authorities/local/root.crt' \
            > caddy-root.crt 2>/dev/null && [ -s caddy-root.crt ]; then
            echo "using the exported Caddy internal CA"
          else
            rm -f caddy-root.crt
            echo "no internal CA on the host; the public CA chain is used"
          fi
      - name: Post-deploy smoke test over HTTPS
        env:
          STAGING_SITE_ADDRESS: ${{ secrets.STAGING_SITE_ADDRESS }}
          STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
        run: |
          if [ -s caddy-root.crt ]; then export STAGING_CA_FILE=./caddy-root.crt; fi
          STAGING_URL="https://${STAGING_SITE_ADDRESS}" \
          STAGING_HTTP_URL="http://${STAGING_SITE_ADDRESS}" \
            node scripts/smoke/staging-smoke.mjs
      - name: Publish host logs on failure
        if: failure()
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" '
            for container in $(docker ps -aq --filter label=com.docker.compose.project=kfin-staging); do
              echo "--- $(docker inspect --format "{{.Name}}" "$container")"
              docker logs --tail=80 "$container" 2>&1
            done
          ' || true
      - name: Log out of the registry on the host
        if: always()
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" 'docker logout ghcr.io' || true
