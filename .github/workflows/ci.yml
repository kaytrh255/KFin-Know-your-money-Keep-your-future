name: KFin CI Quality Gate

on:
  push:
    branches:
      - main
      - "automation/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kfin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Install, static checks, typecheck, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Verify pinned package manager
        run: |
          node --version
          corepack pnpm --version

      - name: Install dependencies from frozen lockfile
        run: corepack pnpm install --frozen-lockfile

      - name: Check evidence harness
        run: corepack pnpm run evidence:check

      - name: Test evidence harness
        run: corepack pnpm run evidence:test

      - name: TypeScript typecheck
        run: corepack pnpm run typecheck

      - name: Unit tests
        run: corepack pnpm run test:unit

      - name: Full test suite (including API tests)
        # No database URL or production credentials are provided in this job.
        # Any PostgreSQL integration test must enforce its own opt-in target guard.
        run: corepack pnpm run test
