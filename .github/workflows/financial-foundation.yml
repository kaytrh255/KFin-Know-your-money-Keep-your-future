name: Financial foundation CI

# The product quality gate. Everything here is derived from the committed package scripts; the workflow
# adds only safety rails, never a different set of checks:
#
#   * the PostgreSQL integration suite is destructive, so it is fenced by a pre-flight guard that
#     refuses any target that is not the disposable service container (loopback, `kfin_test`,
#     `KFIN_INTEGRATION_TARGET=non-production`);
#   * a skipped integration test must never read as success, so the run is re-checked against its
#     machine-readable report and the job fails on skips, todos, failures, or a silently shrunken suite.
#
# No secrets are referenced. The database credential below belongs to the throwaway container created
# for this job and exists nowhere else.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: kfin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kfin_synthetic_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kfin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:kfin_synthetic_test_only@127.0.0.1:5432/kfin_test
      KFIN_INTEGRATION_TARGET: non-production
      # Never let Corepack block on an interactive download prompt inside a non-interactive runner.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Validate evidence harness
        run: |
          corepack pnpm run evidence:check
          corepack pnpm run evidence:test
      - name: Typecheck application and tests
        run: corepack pnpm run typecheck
      - name: Run credential-free unit and API tests
        run: corepack pnpm run test:unit
      - name: Assert the integration target is disposable
        run: node .github/scripts/assert-disposable-target.mjs
      - name: Run isolated real-PostgreSQL integration test
        run: |
          corepack pnpm run test:integration \
            --reporter=default \
            --reporter=json \
            --outputFile="$RUNNER_TEMP/kfin-integration.json"
      - name: Assert the integration suite actually executed
        run: node .github/scripts/assert-integration-ran.mjs "$RUNNER_TEMP/kfin-integration.json"
